<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lynox — مطور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0e1a;
    --bg-1:#0f1424;
    --violet:#8b7bff;
    --teal:#39e0c4;
    --coral:#ff6f9c;
    --glass-fill: rgba(255,255,255,0.055);
    --glass-fill-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.16);
    --glass-border-soft: rgba(255,255,255,0.08);
    --text-0:#f3f4fb;
    --text-1:#c7cbe0;
    --text-2:#8b8fa8;
    --mono:'JetBrains Mono', monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Tajawal', sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100vh;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--body);
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
  }

  /* ---------- Aurora background ---------- */
  .aurora{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #131a30 0%, var(--bg-0) 60%);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter: blur(64px);
    opacity:0.5;
    will-change: transform;
    transform: translateZ(0);
  }
  .blob.b1{
    width:440px; height:440px;
    background: var(--violet);
    top:-140px; right:-120px;
    animation: float1 28s cubic-bezier(.45,0,.55,1) infinite;
  }
  .blob.b2{
    width:400px; height:400px;
    background: var(--teal);
    bottom:-160px; left:-140px;
    animation: float2 34s cubic-bezier(.45,0,.55,1) infinite;
  }
  .blob.b3{
    width:300px; height:300px;
    background: var(--coral);
    bottom:10%; right:8%;
    opacity:0.3;
    animation: float3 24s cubic-bezier(.45,0,.55,1) infinite;
  }
  .aurora{
    will-change: transform;
  }
  .grain{ display:none; }

  @keyframes float1{
    0%{ transform: translate(0,0) scale(1); }
    25%{ transform: translate(-60px, 40px) scale(1.06); }
    50%{ transform: translate(-30px, 90px) scale(1.1); }
    75%{ transform: translate(30px, 40px) scale(1.03); }
    100%{ transform: translate(0,0) scale(1); }
  }
  @keyframes float2{
    0%{ transform: translate(0,0) scale(1); }
    30%{ transform: translate(60px,-30px) scale(1.05); }
    55%{ transform: translate(90px,20px) scale(0.96); }
    80%{ transform: translate(20px,50px) scale(1.02); }
    100%{ transform: translate(0,0) scale(1); }
  }
  @keyframes float3{
    0%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(-40px,-50px) scale(1.12); }
    66%{ transform: translate(20px,-20px) scale(0.94); }
    100%{ transform: translate(0,0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .blob{ animation:none !important; }
    .avatar{ animation: avatarPop 0.6s ease forwards !important; }
    .name{ animation: rise 0.6s ease forwards !important; }
    .status-dot::after{ animation:none !important; }
    *{ scroll-behavior:auto !important; }
  }

  /* ---------- Top nav / dropdown ---------- */
  .topnav{
    position:fixed;
    top:22px;
    inset-inline-end:22px;
    z-index:20;
  }
  .nav-toggle{
    width:46px; height:46px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color: var(--text-0);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), border-color 0.25s ease;
  }
  .nav-toggle:hover{ transform: translateY(-2px); border-color: rgba(255,255,255,0.3); }
  .nav-toggle svg{ width:20px; height:20px; }
  .nav-toggle .icon-close{ display:none; }
  .nav-toggle.open .icon-open{ display:none; }
  .nav-toggle.open .icon-close{ display:block; }

  .nav-dropdown{
    position:absolute;
    top:56px;
    inset-inline-end:0;
    min-width:190px;
    border-radius:16px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:2px;
    opacity:0;
    transform: translateY(-8px) scale(0.96);
    pointer-events:none;
    transform-origin: top left;
    transition: opacity 0.28s cubic-bezier(.16,1,.3,1), transform 0.28s cubic-bezier(.16,1,.3,1);
  }
  .nav-dropdown.open{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 13px;
    border-radius:11px;
    color: var(--text-1);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .nav-item:hover{
    background: rgba(255,255,255,0.08);
    color: var(--text-0);
  }
  .nav-item.active{
    color: var(--teal);
    background: rgba(57,224,196,0.08);
  }
  .nav-item .dot-ind{
    width:5px; height:5px; border-radius:50%;
    background: var(--teal);
    opacity:0;
    flex-shrink:0;
  }
  .nav-item.active .dot-ind{ opacity:1; }

  /* ---------- Layout ---------- */
  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }

  /* ---------- Glass mixin-ish ---------- */
  .glass{
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    box-shadow:
      0 8px 32px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* ---------- Avatar / identity card ---------- */
  .id-card{
    width:100%;
    border-radius:28px;
    padding:36px 30px 30px;
    text-align:center;
    opacity:0;
    animation: rise 0.9s cubic-bezier(.16,1,.3,1) 0.05s forwards;
  }

  .avatar{
    width:96px; height:96px;
    margin:0 auto 18px;
    border-radius:24px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    padding:3px;
    background: linear-gradient(135deg, var(--teal), var(--violet));
    box-shadow: 0 10px 30px rgba(139,123,255,0.35);
    animation: avatarPop 0.8s cubic-bezier(.34,1.56,.64,1) 0.3s both,
               avatarFloat 5s ease-in-out 1.1s infinite;
  }
  .avatar img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:21px;
    display:block;
  }
  @keyframes avatarPop{
    0%{ opacity:0; transform: scale(0.6) rotate(-8deg); }
    100%{ opacity:1; transform: scale(1) rotate(0); }
  }
  @keyframes avatarFloat{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-7px); }
  }

  .name{
    font-family: var(--display);
    font-size: 40px;
    font-weight:700;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #ffffff, var(--teal) 60%, var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation: rise 0.8s cubic-bezier(.16,1,.3,1) 0.5s forwards;
  }
  .tag-bracket{
    font-family: var(--mono);
    font-weight:500;
    -webkit-background-clip: initial;
    background-clip: initial;
    -webkit-text-fill-color: var(--text-2);
    color: var(--text-2);
    opacity:0.7;
  }
  .code-comment{
    font-family: var(--mono);
    font-size:12.5px;
    color: var(--text-2);
    direction:ltr;
    text-align:center;
    margin:0 0 4px;
    opacity:0;
    animation: rise 0.7s cubic-bezier(.16,1,.3,1) 0.42s forwards;
  }

  .bio{
    color: var(--text-2);
    font-family: var(--mono);
    font-size:13.5px;
    line-height:1.9;
    max-width:360px;
    margin: 10px auto 0;
    font-weight:400;
    font-style:italic;
    opacity:0;
    animation: rise 0.8s cubic-bezier(.16,1,.3,1) 0.62s forwards;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:16px;
    padding:7px 14px 7px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    color: var(--text-1);
    opacity:0;
    animation: rise 0.8s cubic-bezier(.16,1,.3,1) 0.7s forwards;
  }
  .status-dot{
    width:8px; height:8px;
    border-radius:50%;
    background: #34d399;
    position:relative;
    flex-shrink:0;
  }
  .status-dot::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background: #34d399;
    opacity:0.5;
    animation: statusPulse 2.2s ease-out infinite;
  }
  @keyframes statusPulse{
    0%{ transform: scale(0.6); opacity:0.5; }
    100%{ transform: scale(1.8); opacity:0; }
  }

  /* ---------- Terminal strip (signature element) ---------- */
  .terminal{
    width:100%;
    border-radius:18px;
    overflow:hidden;
    opacity:0;
    animation: rise 0.9s cubic-bezier(.16,1,.3,1) 0.74s forwards;
  }
  .terminal-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 16px;
    border-bottom:1px solid var(--glass-border-soft);
    background: rgba(255,255,255,0.03);
  }
  .dot{ width:11px; height:11px; border-radius:50%; opacity:0.85; }
  .dot.r{ background:#ff5f57; }
  .dot.y{ background:#febc2e; }
  .dot.g{ background:#28c840; }
  .terminal-title{
    margin-inline-start:auto;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-2);
    direction:ltr;
  }
  .terminal-body{
    padding:20px 20px 24px;
    font-family:var(--mono);
    font-size:14.5px;
    line-height:1.9;
    direction:ltr;
    text-align:left;
  }
  .prompt{ color: var(--teal); }
  .path{ color: var(--violet); }
  .out{ color: var(--text-1); }
  .cmdline{ color: var(--text-0); }
  #typed{ color:#fff; font-weight:500; }
  .cursor{
    display:inline-block;
    width:8px; height:16px;
    background: var(--teal);
    margin-inline-start:3px;
    vertical-align:-2px;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink{ 0%,45%{ opacity:1; } 50%,95%{ opacity:0; } 100%{ opacity:1; } }

  /* ---------- Links grid ---------- */
  .links{
    width:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 16px;
    border-radius:16px;
    text-decoration:none;
    color: var(--text-0);
    font-weight:500;
    font-size:14.5px;
    opacity:0;
    transform: translateY(14px);
    animation: rise 0.6s cubic-bezier(.16,1,.3,1) forwards;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1),
                background 0.25s ease, border-color 0.25s ease;
  }
  .link-btn:nth-child(1){ animation-delay: 0.95s; }
  .link-btn:nth-child(2){ animation-delay: 1.03s; }
  .link-btn:nth-child(3){ animation-delay: 1.11s; }
  .link-btn:nth-child(4){ animation-delay: 1.19s; }
  .link-btn:nth-child(5){ animation-delay: 1.27s; }
  .link-btn:nth-child(6){ animation-delay: 1.35s; }
  .link-btn:hover, .link-btn:focus-visible{
    transform: translateY(-4px);
    background: var(--glass-fill-strong);
    border-color: rgba(255,255,255,0.3);
  }
  .link-btn:active{
    transform: translateY(-1px) scale(0.98);
    transition-duration: 0.12s;
  }
  .link-btn:focus-visible{
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
  .link-btn svg{
    width:20px; height:20px;
    flex-shrink:0;
    color: var(--teal);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .link-btn:hover svg{
    transform: scale(1.12);
  }
  .link-btn:nth-of-type(2n) svg{ color: var(--violet); }
  .link-btn:nth-of-type(3n) svg{ color: var(--coral); }

  footer{
    color: var(--text-2);
    font-size:12.5px;
    text-align:center;
    font-family:var(--mono);
    direction:ltr;
    opacity:0;
    animation: rise 0.8s cubic-bezier(.16,1,.3,1) 1.5s forwards;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  @media (max-width:420px){
    .links{ grid-template-columns: 1fr; }
    .name{ font-size:34px; }
  }

  /* ---------- Floating code glyphs ---------- */
  .code-glyphs{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .glyph{
    position:absolute;
    font-family:'JetBrains Mono', monospace;
    color: var(--text-2);
    opacity:0.10;
    font-weight:500;
    user-select:none;
  }
  .glyph.g1{ top:8%; left:8%; font-size:38px; animation: glyphDrift1 26s ease-in-out infinite; }
  .glyph.g2{ top:15%; right:10%; font-size:26px; animation: glyphDrift2 32s ease-in-out infinite; color: var(--teal); opacity:0.12; }
  .glyph.g3{ bottom:12%; left:6%; font-size:30px; animation: glyphDrift3 29s ease-in-out infinite; color: var(--violet); opacity:0.12; }
  .glyph.g4{ bottom:20%; right:9%; font-size:22px; animation: glyphDrift1 24s ease-in-out infinite reverse; }
  .glyph.g5{ top:45%; left:3%; font-size:20px; animation: glyphDrift2 30s ease-in-out infinite reverse; color: var(--coral); opacity:0.1; }
  .glyph.g6{ top:38%; right:4%; font-size:24px; animation: glyphDrift3 27s ease-in-out infinite; }

  @keyframes glyphDrift1{
    0%,100%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(14px,-22px) rotate(-4deg); }
  }
  @keyframes glyphDrift2{
    0%,100%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(-18px,16px) rotate(5deg); }
  }
  @keyframes glyphDrift3{
    0%,100%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(12px,20px) rotate(-3deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .glyph{ animation:none !important; }
  }
</style>
</head>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Dropdown menu toggle
  const navToggle = document.getElementById('navToggle');
  const navDropdown = document.getElementById('navDropdown');
  navToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = navDropdown.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });
  document.addEventListener('click', (e) => {
    if (!navDropdown.contains(e.target) && !navToggle.contains(e.target)) {
      navDropdown.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', false);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      navDropdown.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', false);
    }
  });

  const roles = ['Full Stack Developer', 'Backend Engineer', 'Problem Solver', 'مطور برمجيات'];
  const el = document.getElementById('typed');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduceMotion) {
    el.textContent = roles[0];
  } else {
    let roleIndex = 0, charIndex = 0, deleting = false;

    function tick(){
      const current = roles[roleIndex];
      if(!deleting){
        charIndex++;
        el.textContent = current.slice(0, charIndex);
        if(charIndex === current.length){
          deleting = true;
          setTimeout(tick, 1400);
          return;
        }
      } else {
        charIndex--;
        el.textContent = current.slice(0, charIndex);
        if(charIndex === 0){
          deleting = false;
          roleIndex = (roleIndex + 1) % roles.length;
        }
      }
      setTimeout(tick, deleting ? 40 : 70);
    }
    tick();
  }

  // Subtle parallax on the aurora blobs, following pointer movement smoothly.
  // The animation loop stops itself once it settles, instead of running forever.
  if (!reduceMotion && window.matchMedia('(pointer: fine)').matches) {
    const aurora = document.querySelector('.aurora');
    let targetX = 0, targetY = 0, curX = 0, curY = 0;
    let rafId = null;

    function animateParallax(){
      curX += (targetX - curX) * 0.08;
      curY += (targetY - curY) * 0.08;
      aurora.style.transform = `translate3d(${curX.toFixed(2)}px, ${curY.toFixed(2)}px, 0)`;
      if (Math.abs(targetX - curX) > 0.1 || Math.abs(targetY - curY) > 0.1) {
        rafId = requestAnimationFrame(animateParallax);
      } else {
        rafId = null;
      }
    }

    let ticking = false;
    window.addEventListener('pointermove', (e) => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      targetX = nx * 14;
      targetY = ny * 14;
      if (!rafId) rafId = requestAnimationFrame(animateParallax);
    }, { passive: true });
  }
</script>
