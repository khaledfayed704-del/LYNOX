<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أورانوس UORANOS — Nova Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00d4ff;
            --purple: #7b2cbf;
            --gold: #f59e0b;
            --dark: #0a0a0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background */
        .bg-effects {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-effects .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 12s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--cyan);
            top: -10%;
            right: -10%;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--purple);
            bottom: -10%;
            left: -10%;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: var(--gold);
            top: 40%;
            left: 30%;
            animation-delay: -8s;
            opacity: 0.2;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        /* Main */
        .main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Logo */
        .logo-ring {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3), 0 0 80px rgba(123, 44, 191, 0.15);
            animation: pulse-glow 3s ease-in-out infinite;
            position: relative;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), var(--purple), var(--gold));
            z-index: -1;
            filter: blur(12px);
            opacity: 0.6;
            animation: spin 8s linear infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.3), 0 0 80px rgba(123, 44, 191, 0.15); }
            50% { box-shadow: 0 0 60px rgba(0, 212, 255, 0.5), 0 0 100px rgba(123, 44, 191, 0.25); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Title */
        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 50%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease forwards;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #777;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease 0.15s forwards;
            opacity: 0;
        }

        /* Divider */
        .fancy-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 30px auto;
            animation: fadeInUp 0.8s ease 0.25s forwards;
            opacity: 0;
        }

        .fancy-divider .line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        }

        .fancy-divider .dot {
            width: 8px;
            height: 8px;
            background: var(--cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--cyan);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Description */
        .desc-card {
            background: rgba(17, 17, 24, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px 35px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease 0.35s forwards;
            opacity: 0;
        }

        .desc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
        }

        .desc-card p {
            font-size: 1.1rem;
            color: #bbb;
            line-height: 2;
            font-weight: 400;
        }

        .desc-card .highlight {
            color: var(--cyan);
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease 0.45s forwards;
            opacity: 0;
        }

        .btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            overflow: hidden;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn:hover::before {
            transform: translateX(100%);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            color: #000;
            box-shadow: 0 4px 25px rgba(0, 212, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #e0e0e0;
            border-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--cyan);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.15);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: #000;
            box-shadow: 0 4px 25px rgba(245, 158, 11, 0.25);
        }

        .btn-gold:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(245, 158, 11, 0.4);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 50px;
            animation: fadeInUp 0.8s ease 0.55s forwards;
            opacity: 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* Footer */
        footer {
            animation: fadeInUp 0.8s ease 0.65s forwards;
            opacity: 0;
            color: #444;
            font-size: 0.85rem;
            font-weight: 300;
        }

        footer a {
            color: var(--cyan);
            text-decoration: none;
            font-weight: 600;
            position: relative;
        }

        footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--cyan);
            transition: width 0.3s ease;
        }

        footer a:hover::after {
            width: 100%;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 0.9rem; letter-spacing: 2px; }
            .desc-card { padding: 22px 20px; }
            .desc-card p { font-size: 0.95rem; }
            .btn { padding: 12px 24px; font-size: 0.9rem; max-width: 280px; }
            .stats { gap: 30px; }
            .stat-number { font-size: 1.5rem; }
            .logo-ring { width: 70px; height: 70px; font-size: 2rem; }
        }
    </style>
</head>
